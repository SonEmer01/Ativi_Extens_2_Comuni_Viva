<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voluntariar - Comunidade Viva</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌱 Comunidade Viva</h1>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="solicitar.html">Solicitar Ações</a></li>
        <li><a href="voluntario.html">Seja Voluntário</a></li>
        <li><a href="resultados.html">Resultados</a></li>
        <li><a href="blog.html">Notícias</a></li>
      </ul>
    </nav>
  </header>

  <main style="background-color: #effaf6; padding: 40px;">
    <h2 style="color: #045062; text-align: center;">🤝 Seja Voluntário ou Parceiro</h2>
    <p style="text-align: center; max-width: 700px; margin: 0 auto; color: #345a5f;">
      Participe da transformação! Sua experiência, tempo ou estrutura pode impactar vidas.
    </p>

    <form style="max-width: 600px; margin: 30px auto; background-color: #ffffff; padding: 30px; border-radius: 10px;">
      <label for="nome">Nome ou Razão Social:</label><br>
      <input type="text" id="nome" name="nome" required><br><br>

      <label for="contato">E-mail ou Telefone:</label><br>
      <input type="text" id="contato" name="contato"><br><br>

      <label for="area">Área de Atuação:</label><br>
      <input type="text" id="area" name="area"><br><br>

      <label for="disponibilidade">Como deseja apoiar:</label><br>
      <textarea id="disponibilidade" name="disponibilidade" rows="4"></textarea><br><br>

      <button type="submit" style="background-color: #6db9a3; color: white; padding: 12px 24px; border-radius: 20px;">
        Enviar Cadastro
      </button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Comunidade Viva. Desenvolvido por Emerson Floriano da Silv.</p>
  </footer>
</body>
</html>
